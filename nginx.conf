events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $uri $loggable {
        ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp3)$ 0;
        default 1;
    }

    log_format minimal '$time_local $remote_addr "$request" $status $body_bytes_sent';

    access_log /var/log/nginx/nginx_access.log minimal if=$loggable;
    error_log /var/log/nginx/nginx_error.log;

    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    

    # Frontend app - served on port 80
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html/frontend;
        index index.html;

        # captive portal triggers
        location = /generate_204 { try_files /captive.html =200; }
        location = /hotspot-detect.html { try_files /hotspot-detect.html =200; }
        location = /hotspotdetect.html { try_files /hotspot-detect.html =200; }
        location = /connecttest.txt { try_files /captive.html =200; }
        location = /ncsi.txt { try_files /captive.html =200; }

        location ^~ /api/backend/ {
            proxy_pass http://minodu-backend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location ^~ /api/services/ {
            proxy_pass http://minodu-ai-services:3002/api/services/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            # Streaming support for LLM responses
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
        }

        location ^~ /api/forum/ {
            proxy_pass http://minodu-forum:3003/api/forum/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

         # Frontend - Svelte app
        location / {
            try_files $uri /index.html;
        }

        # explicitly handle static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Error page
        error_page 404 /index.html;
    }

    # Backoffice app - served on port 8080
    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html/backoffice;
        index index.html;

        location ^~ /api/backend/ {
            proxy_pass http://minodu-backend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location ^~ /api/services/ {
            proxy_pass http://minodu-ai-services:3002/api/services/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            # Streaming support for LLM responses
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
        }

        location ^~ /api/forum/ {
            proxy_pass http://minodu-forum:3003/api/forum/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Backoffice [Angular app]
        location / {
            try_files $uri /index.html;
        }

        # explicitly handle static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Error pages
        error_page 404 /index.html;
    }
}