[tool.coverage.run]
branch = true
source = [ "minodu_file_converter" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/minodu-file-converter/html'
 --cov-report xml:'../../coverage/apps/minodu-file-converter/coverage.xml'
 --html='../../reports/apps/minodu-file-converter/unittests/html/index.html'
 --junitxml='../../reports/apps/minodu-file-converter/unittests/junit.xml'
"""

[tool.poetry]
name = "minodu-file-converter"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = 'Proprietary'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "minodu_file_converter"

  [tool.poetry.dependencies]
  python = ">=3.12,<3.13"
  celery = "^5.6.0"
  redis = "^7.1.0"
  pillow = "^12.0.0"
  pydub = "^0.25.1"
  requests = "^2.32.5"
  pytest-asyncio = "^1.3.0"

  [tool.poetry.group.dev.dependencies]
  autopep8 = "2.3.1"
  flake8 = "7.1.1"
  pytest = "8.3.4"
  pytest-sugar = "1.0.0"
  pytest-cov = "6.0.0"
  pytest-html = "4.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
