services:
  minodu-database:
    build: .
    container_name: minodu-database
    restart: always
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: minodu
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - ./data:/var/lib/mysql
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql  # Optional: will be removed later
    networks:
      - mysql-network

networks:
  mysql-network:
    driver: bridge
    name: minodu-network