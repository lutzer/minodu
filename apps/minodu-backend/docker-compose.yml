services:
  app:
    build: .
    container_name: minodu-backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_NAME: minodu
      APP_PORT: 3000
      APP_HOST: http://minodu.chickenkiller.com:3000
      APP_FRONT: http://minodu.chickenkiller.com #http://localhost #http://minodu.chickenkiller.com/
      JWT_SECRET: OD3cOjhWWOZb58A2t7wpE2S9XfBYTiIl+XFhQG2bjy4
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: minodu-database
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/dbsql/minodu.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: minodu
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

volumes:
  mysql_data: